<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرعة — نموذج تفاعلي</title>
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script>
/* ألوان جرعة (DESIGN.md / theme.ts). الألوان الموضوعية ثابتة، وألوان السطح متغيرات CSS
   حتى يبدّلها الوضع الداكن ووضع الرعاية دون تغيير الأصناف. */
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { cairo: ['Cairo', 'system-ui', 'sans-serif'] },
      colors: {
        primary: '#0E3A5A', success: '#2D8A6B', alert: '#D9534F', warning: '#D99B26', appt: '#3B6E9E',
        bg: 'var(--bg)', card: 'var(--card)', cardb: 'var(--card-border)', ink: 'var(--text)', muted: 'var(--text2)',
        sep: 'var(--sep)', tint: 'var(--tint)', field: 'var(--field)', appbar: 'var(--appbar)', nav: 'var(--nav)', stage: 'var(--stage)',
      },
      borderRadius: { '2.5xl': '1.25rem' },
    },
  },
};
</script>
<style type="text/tailwindcss">
  :root{
    --bg:#F7F9FA; --card:rgba(255,255,255,.86); --card-border:rgba(14,58,90,.08);
    --text:#0E3A5A; --text2:#5B6B78; --sep:#E2E8F0; --tint:#0E3A5A; --field:rgba(14,58,90,.06);
    --appbar:rgba(244,246,248,.8); --nav:rgba(255,255,255,.78); --stage:#E6ECF0;
  }
  [data-theme="dark"]{
    --bg:#121B22; --card:rgba(26,34,40,.92); --card-border:rgba(255,255,255,.06);
    --text:#FFFFFF; --text2:#94A3B8; --sep:#1E293B; --tint:#8CC4E8; --field:rgba(255,255,255,.07);
    --appbar:rgba(13,21,27,.85); --nav:rgba(13,21,27,.85); --stage:#0B1117;
  }
  /* وضع الرعاية: سطح فاتح دافئ وتكبير العناصر */
  [data-alz="1"] .screen{ --bg:#F9EFE6; --card:#FFFFFF; --text:#0E3A5A; --text2:#5B6B78; --field:rgba(14,58,90,.07); --appbar:rgba(249,239,230,.9); --nav:rgba(255,255,255,.9); --sep:#E2E8F0; }
  [data-alz="1"] .hide-alz{ display:none !important; }
  [data-alz="1"] .bigpill{ display:grid !important; }
  [data-alz="1"] .due-name{ font-size:30px; }
  [data-alz="1"] .due-act{ height:64px; font-size:19px; border-radius:18px; }
  [data-alz="1"] .item{ padding:18px 14px; }
  [data-alz="1"] .item .n{ font-size:20px; }
  [data-alz="1"] .item .t{ font-size:16px; min-width:56px; }
  [data-alz="1"] .btn-full{ height:66px; font-size:19px; }
  [data-alz="1"] .fab{ display:none; }

  /* الإطار المتحرك حول بطاقة الجرعة المستحقة (لا يُعبَّر عنه بأصناف Tailwind) */
  @property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  @keyframes spin { to { --a:360deg; } }
  .due{ background:conic-gradient(from var(--a),#2D8A6B,#D99B26,#0E3A5A,#2D8A6B); animation:spin 4s linear infinite; }
  .ring{ background:conic-gradient(#2D8A6B calc(var(--p)*1%), var(--field) 0); }
  .ring::after{ content:''; position:absolute; inset:6px; border-radius:50%; background:var(--bg); }
  .sw::after{ content:''; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; }
  .sw.on::after{ right:21px; }
  .qr{ background:repeating-linear-gradient(90deg,var(--text) 0 8px,transparent 8px 16px),repeating-linear-gradient(0deg,var(--text) 0 8px,var(--bg) 8px 16px); background-blend-mode:difference; }
  .view{ scrollbar-width:none; } .view::-webkit-scrollbar{ display:none; }
  @keyframes up { from { transform:translateY(60px); opacity:0; } }
  .sheet-in{ animation:up .3s cubic-bezier(.2,.8,.2,1); }

  /* ---- الحركة ---- */
  @keyframes screen-in { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes pulse-ring { 0%{ box-shadow:0 0 0 0 rgba(45,138,107,.5); } 70%{ box-shadow:0 0 0 12px rgba(45,138,107,0); } 100%{ box-shadow:0 0 0 0 rgba(45,138,107,0); } }
  @keyframes blob { 0%,100%{ transform:translate(0,0) scale(1); } 33%{ transform:translate(40px,-30px) scale(1.1); } 66%{ transform:translate(-30px,25px) scale(.95); } }
  @keyframes wiggle { 0%,100%{ transform:rotate(0); } 20%{ transform:rotate(-12deg); } 40%{ transform:rotate(10deg); } 60%{ transform:rotate(-6deg); } 80%{ transform:rotate(4deg); } }
  @keyframes pop { 0%{ transform:scale(.6); opacity:0; } 60%{ transform:scale(1.15); } 100%{ transform:scale(1); opacity:1; } }
  @keyframes shimmer { to { background-position:200% center; } }
  @keyframes ring-fill { from { --p:0; } }
  @property --p { syntax:'<number>'; inherits:false; initial-value:0; }
  #screens > * { animation: screen-in .32s cubic-bezier(.2,.8,.2,1); }
  .view > .card, .view > .med, .view > .due, .view > .appbar ~ .row, .view .hello-anim, .view > .btn, .view > .flex, .view > .grid { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .view > *:nth-child(2){ animation-delay:.04s } .view > *:nth-child(3){ animation-delay:.08s } .view > *:nth-child(4){ animation-delay:.12s } .view > *:nth-child(5){ animation-delay:.16s } .view > *:nth-child(6){ animation-delay:.20s } .view > *:nth-child(7){ animation-delay:.24s } .view > *:nth-child(8){ animation-delay:.28s } .view > *:nth-child(n+9){ animation-delay:.32s }
  .pulse { animation: pulse-ring 2.2s ease-out infinite; }
  .ring { animation: ring-fill 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .fab { transition: transform .2s; } .fab:hover { transform: scale(1.08) rotate(90deg); }
  .nav-btn { transition: transform .15s, color .2s; } .nav-btn.on span { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
  .med, .item, .opt, .day, .cup { transition: transform .18s, box-shadow .18s, background .18s; }
  .med:hover, .opt:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -10px rgba(14,58,90,.35); }
  .med:active, .item:active, .cup:active, .btn:active { transform: scale(.97); }
  .bell:hover { animation: wiggle .6s; }
  .check-pop { animation: pop .4s cubic-bezier(.2,.8,.2,1); }
  .shine { background: linear-gradient(90deg,#fff 0%,#fff 40%,#8CC4E8 50%,#fff 60%,#fff 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation: shimmer 4s linear infinite; }
  .bar i { transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .stage-blob { position:absolute; border-radius:9999px; filter:blur(64px); pointer-events:none; animation: blob 18s ease-in-out infinite; }
  .toast { transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  @media (prefers-reduced-motion: reduce) {
    #screens > *, .view > *, .pulse, .ring, .nav-btn.on span, .bell:hover, .check-pop, .shine, .stage-blob { animation: none !important; }
    .med:hover, .opt:hover, .fab:hover { transform: none !important; }
  }

  @layer base {
    h1, h2, h3, b { line-height: 1.8; }
    p { @apply leading-[1.85]; }
  }
  @layer components {
    .card { @apply bg-card border border-cardb rounded-2.5xl p-4 mb-3.5 backdrop-blur-md; }
    .card h3 { @apply text-[17px] font-bold mb-2.5 leading-[1.8]; }
    .sub { @apply text-muted text-[14px] leading-[1.8]; }
    .row { @apply flex items-center gap-3; }
    .sb { @apply justify-between; }
    .btn { @apply font-bold text-[16px] border-0 rounded-[14px] h-12 px-[18px] cursor-pointer inline-flex items-center justify-center gap-2 transition-transform active:scale-[.97]; }
    .btn-g { @apply btn bg-success text-white; }
    .btn-n { @apply btn bg-field text-ink; }
    .btn-p { @apply btn bg-primary text-white; }
    .btn-full { @apply w-full h-[54px] rounded-2xl text-[17px]; }
    .chip { @apply inline-block text-[12.5px] px-2.5 py-0.5 rounded-[7px] font-bold; }
    .pill { @apply w-[34px] h-[34px] rounded-[10px] grid place-items-center text-base flex-none border border-black/10; }
    .hr { @apply h-px bg-sep my-3; }
    .field { @apply h-[52px] rounded-[14px] bg-field flex items-center gap-2.5 px-3.5 text-muted text-[15px] mb-3; }
    .ib { @apply w-11 h-11 grid place-items-center rounded-xl text-muted cursor-pointer border-0 bg-transparent text-[22px] hover:bg-field; }
    .appbar { @apply sticky top-0 z-[5] -mx-4 mb-2.5 px-4 pt-1.5 pb-2.5 bg-appbar backdrop-blur-xl border-b border-sep flex items-center justify-between min-h-[44px]; }
    .appbar h2 { @apply text-[22px] font-extrabold; }
    .item { @apply flex items-center gap-3 p-3 rounded-[14px] bg-field; }
    .item .t { @apply text-[14.5px] text-muted min-w-[46px] text-center; }
    .item .n { @apply font-bold text-[16px] leading-[1.7]; }
    .item.done { @apply opacity-60; } .item.done .n { @apply line-through; }
    .item.appt { @apply bg-appt/15 border-r-[3px] border-appt; }
    .item.missed { @apply border-r-[3px] border-alert; }
    .med { @apply flex items-center gap-3 p-4 rounded-2xl bg-card border border-cardb mb-2.5 cursor-pointer text-[16px]; }
    .bar { @apply h-1.5 rounded-[3px] bg-field overflow-hidden mt-1.5; }
    .bar i { @apply block h-full rounded-[3px] bg-success; } .bar i.low { @apply bg-alert; }
    .stat { @apply flex-1 text-center py-3 px-1.5 rounded-[14px] bg-field; }
    .stat b { @apply block text-[22px] font-extrabold; } .stat small { @apply text-muted text-[12.5px]; }
    .set { @apply flex justify-between items-center py-3.5 border-b border-sep last:border-0 leading-[1.8] text-[16px]; }
    .set small { @apply block text-muted text-[14.5px]; }
    .sw { @apply w-11 h-[26px] rounded-[13px] bg-[#94A3B8] relative cursor-pointer transition flex-none; } .sw.on { @apply bg-success; }
    .avatar { @apply w-11 h-11 rounded-full bg-primary text-white grid place-items-center font-extrabold text-lg relative flex-none; }
    .avatar.on::after { content:''; @apply absolute bottom-px left-px w-[11px] h-[11px] rounded-full bg-success border-2 border-bg; }
    .feed { @apply flex gap-2.5 py-3 border-b border-sep last:border-0; }
    .feed i { @apply w-2.5 h-2.5 rounded-full mt-[9px] flex-none; }
    .feed .ok { @apply bg-success; } .feed .warn { @apply bg-warning; } .feed .info { @apply bg-appt; }
    .day { @apply flex-1 h-[66px] rounded-[14px] flex flex-col items-center justify-center gap-0.5 text-[14.5px] text-muted bg-card border border-cardb; }
    .day b { @apply text-[17px] text-ink; }
    .day.today { @apply bg-primary text-white/75; } .day.today b { @apply text-white; }
    .dots { @apply flex gap-[3px] h-[5px]; } .dots i { @apply w-[5px] h-[5px] rounded-full; }
    .cup { @apply flex-1 h-[34px] rounded-[9px] bg-field grid place-items-center cursor-pointer text-[15px] transition; } .cup.f { @apply bg-appt/25; }
    .nav-btn { @apply border-0 bg-transparent text-muted flex flex-col items-center gap-0.5 text-[12.5px] font-bold cursor-pointer w-[64px]; }
    .nav-btn span { @apply text-[23px]; } .nav-btn.on { @apply text-tint; }
    .fab { @apply w-14 h-14 rounded-full bg-success text-white text-3xl grid place-items-center -mt-[30px] shadow-[0_8px_20px_rgba(45,138,107,.45)] border-4 border-bg cursor-pointer; }
    .seg-opt { @apply flex-1 rounded-[18px] grid place-items-center text-[15px] font-bold text-muted cursor-pointer; }
    .seg-opt.on { @apply bg-success text-white shadow-[0_4px_14px_rgba(45,138,107,.4)]; }
    .opt { @apply flex-1 py-[18px] px-2.5 rounded-[18px] bg-card border border-cardb text-center cursor-pointer font-bold text-[16px]; }
    .opt span { @apply block text-[34px] mb-1.5; }
    .shape { @apply w-10 h-10 rounded-xl border-2 border-transparent cursor-pointer; } .shape.on { @apply border-success; }
    .grid-c { @apply h-11 rounded-[10px] flex flex-col items-center justify-center text-[14px] gap-0.5; } .grid-c.today { @apply bg-primary text-white font-extrabold; }
    .panel-btn { @apply w-full text-right px-2.5 py-2 rounded-[9px] border border-cardb bg-transparent text-ink cursor-pointer mb-1.5 hover:bg-field; }
    .panel-btn.active { @apply bg-primary text-white border-transparent; }
    .ins p { @apply text-muted text-[14.5px] leading-[1.85] my-1.5 mb-3; }
  }

  /* على الجوال الحقيقي يملأ الشاشة بلا إطار */
  @media (max-width:760px){
    body{ padding:0 !important; display:block !important; background:var(--bg) !important; }
    .panel{ display:none !important; }
    .phone{ width:100% !important; height:100dvh !important; border-radius:0 !important; padding:0 !important; box-shadow:none !important; }
    .screen{ border-radius:0 !important; }
    .notch{ display:none !important; }
    .status{ height:env(safe-area-inset-top,0px) !important; padding:0 !important; overflow:hidden; }
    .nav{ bottom:calc(10px + env(safe-area-inset-bottom,0px)) !important; }
    .mob-tools{ display:flex !important; }
  }
</style>
</head>
<body data-theme="dark" class="font-cairo bg-stage text-ink text-[16px] leading-[1.8] min-h-screen flex items-center justify-center gap-7 p-5 transition-colors">

<!-- خلفية حية خلف المسرح -->
<div class="fixed inset-0 -z-10 overflow-hidden hidden md:block" aria-hidden="true">
  <div class="stage-blob w-[520px] h-[520px] bg-success/25 -top-40 -right-32"></div>
  <div class="stage-blob w-[460px] h-[460px] bg-appt/25 top-[45%] -left-40" style="animation-delay:-6s"></div>
  <div class="stage-blob w-[380px] h-[380px] bg-warning/15 bottom-[-120px] right-[35%]" style="animation-delay:-12s"></div>
</div>

<!-- لوحة العرض الجانبية -->
<aside class="panel w-[250px] text-sm flex flex-col gap-3.5">
  <h1 class="text-xl font-extrabold flex items-center gap-2.5"><img src="../assets/icon.png" alt="" class="w-9 h-9 rounded-[9px]">جرعة <span class="text-[13px] text-warning border border-warning rounded-md px-1.5 mr-1.5 font-semibold">نموذج أولي</span></h1>
  <a id="backLink" href="../index.html" class="hidden items-center justify-center gap-2 h-11 rounded-xl bg-primary text-white font-bold no-underline hover:opacity-90">← العودة إلى صفحة العرض</a>
  <p class="text-muted leading-relaxed">نموذج تفاعلي للعرض فقط. لا يتصل بالإنترنت ولا يحفظ بيانات. كل الأسماء وهمية.</p>
  <div class="bg-card border border-cardb rounded-[14px] p-3">
    <b class="block mb-2 text-[14.5px]">الشاشات</b>
    <button class="panel-btn !bg-success/15 !border-success/40 font-bold" data-go="about">★ التطبيق والخدمات</button>
    <button class="panel-btn" data-go="onboarding">الترحيب</button>
    <button class="panel-btn" data-go="login">تسجيل الدخول</button>
    <button class="panel-btn" data-go="home">الرئيسية</button>
    <button class="panel-btn" data-go="meds">الأدوية</button>
    <button class="panel-btn" data-go="calendar">التقويم</button>
    <button class="panel-btn" data-go="caregivers">شركاء الرعاية</button>
    <button class="panel-btn" data-go="insights">المساعد الذكي</button>
    <button class="panel-btn" data-go="health">صحتي والساعة</button>
    <button class="panel-btn" data-go="settings">الإعدادات</button>
  </div>
  <div class="bg-card border border-cardb rounded-[14px] p-3">
    <b class="block mb-2 text-[14.5px]">أوضاع العرض</b>
    <div class="flex justify-between items-center py-2 px-0.5"><span>الوضع الداكن</span><div class="sw on" id="swDark"></div></div>
    <div class="flex justify-between items-center py-2 px-0.5"><span>وضع الرعاية</span><div class="sw" id="swAlz"></div></div>
  </div>
  <div class="bg-card border border-cardb rounded-[14px] p-3">
    <b class="block mb-2 text-[14.5px]">اختصارات</b>
    <button class="panel-btn" id="btnNotify">محاكاة إشعار جرعة</button>
    <button class="panel-btn" id="btnReset">إعادة ضبط البيانات</button>
  </div>
</aside>

<!-- أدوات الجوال -->
<div class="mob-tools hidden fixed top-2 left-2 z-[100] gap-1.5">
  <a id="backLinkM" href="../index.html" class="hidden text-xs px-2.5 py-1.5 rounded-[10px] border border-cardb bg-card text-ink no-underline">← العرض</a>
  <button id="mAbout" class="text-xs px-2.5 py-1.5 rounded-[10px] border border-success/40 bg-success/15 text-ink font-bold">★ الخدمات</button>
  <button id="mDark" class="text-xs px-2.5 py-1.5 rounded-[10px] border border-cardb bg-card text-ink">☾ المظهر</button>
  <button id="mAlz" class="text-xs px-2.5 py-1.5 rounded-[10px] border border-cardb bg-card text-ink">وضع الرعاية</button>
</div>

<!-- إطار الهاتف -->
<div class="phone w-[390px] h-[844px] bg-[#0A0F14] rounded-[54px] p-3 shadow-[0_30px_80px_rgba(0,0,0,.35),inset_0_0_0_2px_#2a333b] relative flex-none" id="phone">
  <div class="notch absolute top-[22px] left-1/2 -translate-x-1/2 w-[120px] h-[34px] bg-black rounded-[20px] z-50"></div>
  <div class="screen w-full h-full rounded-[42px] overflow-hidden bg-bg relative flex flex-col transition-colors" id="screen">
    <div class="status h-[54px] flex-none flex items-end justify-between px-[30px] pb-1.5 text-sm font-bold" dir="ltr"><span>9:41</span><span>●●●● ᯤ ▮▮▮</span></div>
    <div class="toast absolute top-[70px] left-4 right-4 bg-primary text-white rounded-2xl px-4 py-3 text-[15px] font-bold shadow-[0_10px_30px_rgba(0,0,0,.3)] z-[60] -translate-y-[120px] opacity-0 transition-all duration-300 flex gap-2.5 items-center" id="toast"><span>💊</span><span id="toastText"></span></div>
    <div id="screens" class="flex-1 min-h-0 flex flex-col"></div>
    <div class="sheet absolute inset-0 bg-black/45 z-40 hidden items-end backdrop-blur-[3px]" id="sheet"><div class="sheet-in w-full bg-bg rounded-t-[28px] px-4 pt-[18px] pb-[30px] max-h-[88%] overflow-auto" id="sheetIn"></div></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const D = window.DEMO;
const $ = (s, r = document) => r.querySelector(s);
const state = { screen: 'about', onb: 0, cups: D.water.cups, meds: JSON.parse(JSON.stringify(D.medications)), tab: 'home', alz: false };

/* زر الرجوع يظهر فقط عندما يُفتح النموذج مستقلاً، لا داخل إطار صفحة العرض */
if (window.self === window.top) { $('#backLink').classList.replace('hidden', 'flex'); $('#backLinkM').classList.replace('hidden', 'inline-flex'); }

/* ---------- أدوات ---------- */
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const t12 = t => { const [h, m] = t.split(':').map(Number); const p = h < 12 ? 'ص' : 'م'; return `${ar(((h + 11) % 12) + 1)}:${ar(String(m).padStart(2, '0'))} ${p}`; };
const addMin = (t, n) => { let [h, m] = t.split(':').map(Number); m += n; h = (h + Math.floor(m / 60)) % 24; m %= 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };
function toast(msg) { $('#toastText').textContent = msg; const el = $('#toast'); el.classList.remove('-translate-y-[120px]', 'opacity-0'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('-translate-y-[120px]', 'opacity-0'), 2600); }
function sheet(html) { $('#sheetIn').innerHTML = `<div class="w-10 h-1 rounded-sm bg-sep mx-auto mb-3.5"></div>${html}`; $('#sheet').classList.replace('hidden', 'flex'); }
function closeSheet() { $('#sheet').classList.replace('flex', 'hidden'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

const takenCount = () => state.meds.filter(m => m.status === 'taken').length;
const nextDue = () => state.meds.find(m => m.status === 'due') || state.meds.find(m => m.status === 'upcoming');

/* ---------- أجزاء مشتركة ---------- */
const appbar = (title, right = '', left = '') => `<div class="appbar">${right}<h2>${title}</h2>${left || '<span class="w-11"></span>'}</div>`;
const back = to => `<button class="ib" data-go="${to}">‹</button>`;
const nav = () => `
<div class="nav absolute bottom-[18px] left-4 right-4 h-16 rounded-[22px] bg-nav backdrop-blur-xl border border-cardb flex items-center justify-around shadow-[0_10px_30px_rgba(0,0,0,.12)] z-20">
  <button class="nav-btn ${state.tab === 'home' ? 'on' : ''}" data-go="home"><span>⌂</span>الرئيسية</button>
  <button class="nav-btn ${state.tab === 'calendar' ? 'on' : ''}" data-go="calendar"><span>▦</span>التقويم</button>
  <div class="fab" id="fab">+</div>

/* ---------- الملاحة والعرض ---------- */
function go(name) {
  const [base] = name.split(':');
  state.screen = name;
  if (['home', 'calendar', 'meds', 'profile'].includes(base)) state.tab = base;
  if (base === 'alerts') state.tab = 'home';
  if (base === 'med') state.tab = 'meds';
  if (['caregivers', 'insights', 'health', 'settings', 'medicalid', 'safezone', 'assess'].includes(base)) state.tab = 'profile';
  if (base === 'about' && !['home', 'profile'].includes(state.tab)) state.tab = 'home';
  render();
  document.querySelectorAll('.panel [data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === base));
}
function render() {
  const [base, arg] = state.screen.split(':');
  $('#screens').innerHTML = S[base](arg);
  const v = $('#screens .view'); if (v) v.scrollTop = 0;
  bind();
  /* أشرطة المخزون تمتلئ بحركة */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('#screens .bar i').forEach(i => { const w = i.style.width; i.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = w; })); });
}
function bind() {
  document.querySelectorAll('#screens [data-go]').forEach(el => el.onclick = e => { e.stopPropagation(); go(el.dataset.go); });
  document.querySelectorAll('[data-toast]').forEach(el => el.onclick = () => toast(el.dataset.toast));
  document.querySelectorAll('#screens [data-sw]').forEach(el => el.onclick = () => el.classList.toggle('on'));
  const onb = $('#onbNext'); if (onb) onb.onclick = () => { if (state.onb < 2) { state.onb++; render(); } else go('login'); };
  document.querySelectorAll('[data-take]').forEach(b => b.onclick = () => { const m = state.meds.find(x => x.id === b.dataset.take); m.status = 'taken'; m.stock--; toast(`أحسنتِ، سُجّلت جرعة ${m.name} وخُصم قرص من المخزون`); render(); });
  document.querySelectorAll('[data-snooze]').forEach(b => b.onclick = () => { const m = state.meds.find(x => x.id === b.dataset.snooze); m.time = addMin(m.time, 15); m.snoozed = true; m.status = 'upcoming'; state.meds.sort((a, b) => a.time.localeCompare(b.time)); toast(`تم التأجيل إلى ${t12(m.time)} · سيصل خالد إشعار إن تأخرت أكثر`); render(); });
  document.querySelectorAll('[data-cup]').forEach(c => c.onclick = () => { state.cups = +c.dataset.cup === state.cups ? state.cups - 1 : +c.dataset.cup; render(); });
  const fab = $('#fab'); if (fab) fab.onclick = () => { sheet(`<h3 class="text-[19px] font-extrabold mb-3.5">ماذا تودّين إضافته؟</h3><div class="flex gap-3"><div class="opt" id="optMed"><span>💊</span>إضافة دواء</div><div class="opt" id="optAppt"><span>🏥</span>إضافة موعد</div></div>`); bindSheet(); };
  const am = $('#addMed'); if (am) am.onclick = openAddMed;
  const rf = $('#refill'); if (rf) rf.onclick = () => { const m = state.meds.find(x => state.screen.endsWith(x.id)); m.stock = m.total; toast('تم تحديث المخزون إلى العبوة الكاملة'); render(); };
  const inv = $('#invite'); if (inv) inv.onclick = () => { sheet(`<h3 class="text-[19px] font-extrabold">دعوة شريك رعاية</h3><p class="sub mt-1.5 mb-2.5">يمسح قريبك هذا الرمز من تطبيق جرعة، ثم تحدّدين صلاحياته قبل الربط.</p><div class="qr w-[150px] h-[150px] my-2.5 mx-auto rounded-[14px] opacity-85 border-8 border-bg outline outline-1 outline-sep"></div><div class="text-center"><b class="tracking-[4px] text-[22px]">JRH-4K2P</b><div class="sub">ينتهي خلال ١٠ دقائق</div></div><div class="flex gap-2.5 mt-3.5"><button class="btn-p flex-1" data-toast="تم نسخ رابط الدعوة">نسخ الرابط</button><button class="btn-n flex-1" data-toast="مشاركة عبر واتساب">واتساب</button></div>`); bindSheet(); };
  const sa = $('#suggestAlz'); if (sa) sa.onclick = () => setAlz(true);
  const aa = $('#aboutAlz'); if (aa) aa.onclick = () => setAlz(true);
  const sd = $('#setDark'); if (sd) sd.onclick = () => setDark(document.body.dataset.theme !== 'dark');
  const sz = $('#setAlz'); if (sz) sz.onclick = () => setAlz(!state.alz);
}
function bindSheet() {

    <div class="field">🏥 <span class="opacity-80">العيادة أو المستشفى</span></div><div class="field">📅 <span class="opacity-80">التاريخ</span></div><div class="field">🕒 <span class="opacity-80">الساعة</span></div><div class="field">🔔 <span class="text-ink">تنبيه قبل يوم وقبل ساعتين</span></div>
    <button class="btn-p btn-full" data-toast="تم حفظ الموعد">حفظ الموعد</button>`); bindSheet(); };
  const save = $('#saveMed', sIn); if (save) save.onclick = () => {
    const name = $('#newName', sIn).value.trim() || 'دواء جديد';
    const color = $('.shape.on', sIn)?.dataset.c || '#F2F2F2';
    state.meds.push({ id: 'm' + Date.now(), name, dose: $('#newDose', sIn).value.trim() || 'قرص واحد', form: 'قرص', color, time: $('#newTime', sIn).value || '22:00', note: 'يومياً', status: 'upcoming', stock: 30, total: 30, adherence: 100 });
    state.meds.sort((a, b) => a.time.localeCompare(b.time));
    closeSheet(); toast(`أُضيف ${name} وجُدولت تنبيهاته`); go('meds');
  };
  sIn.querySelectorAll('.shape').forEach(d => d.onclick = () => { sIn.querySelectorAll('.shape').forEach(x => x.classList.remove('on')); d.classList.add('on'); });
}
function openAddMed() {
  const colors = ['#F2F2F2', '#F2C94C', '#5B9BD5', '#E06464', '#6CBF84', '#F2994A', '#F08BB4'];
  const inp = 'flex-1 bg-transparent border-0 font-cairo text-ink outline-none';

    <div class="field">💊 <input id="newName" placeholder="اسم الدواء (مثال: بانادول)" class="${inp}"></div>
    <div class="field">⚖️ <input id="newDose" placeholder="الجرعة (مثال: ٥٠٠ ملغ)" class="${inp}"></div>
    <div class="field">🕒 <input id="newTime" type="time" value="22:00" class="${inp}"></div>
    <div class="sub">شكل ولون الحبة</div><div class="flex gap-2 flex-wrap my-2 mb-3.5">${colors.map((c, i) => `<div data-c="${c}" class="shape ${i === 0 ? 'on' : ''}" style="background:${c}"></div>`).join('')}</div>
    <div class="sub mb-3">✨ سيتعرّف التطبيق على المادة الفعالة ويحذّر من التفاعلات تلقائياً</div>
    <button class="btn-g btn-full" id="saveMed">حفظ</button>`);
  bindSheet();
}

/* ---------- الأوضاع ---------- */
function setDark(on) { document.body.dataset.theme = on ? 'dark' : 'light'; $('#swDark').classList.toggle('on', on); if (state.screen === 'settings') render(); }
function setAlz(on) { state.alz = on; $('#phone').dataset.alz = on ? '1' : '0'; $('#swAlz').classList.toggle('on', on); if (on) { setDark(false); toast('تم تفعيل وضع الرعاية: أزرار أكبر وشاشة أبسط'); } if (state.screen === 'settings' || state.screen === 'insights') go('home'); else render(); }
$('#swDark').onclick = () => setDark(!$('#swDark').classList.contains('on'));
$('#swAlz').onclick = () => setAlz(!state.alz);
$('#mAbout').onclick = () => go('about');
$('#mDark').onclick = () => setDark(document.body.dataset.theme !== 'dark');
$('#mAlz').onclick = () => setAlz(!state.alz);
document.querySelectorAll('.panel [data-go]').forEach(b => b.onclick = () => { if (b.dataset.go === 'onboarding') state.onb = 0; go(b.dataset.go); });
$('#btnNotify').onclick = () => { toast('⏰ حان وقت أتورفاستاتين ٢٠ ملغ · مع الغداء'); if (state.screen !== 'home') go('home'); };
$('#btnReset').onclick = () => { state.meds = JSON.parse(JSON.stringify(D.medications)); state.cups = D.water.cups; state.onb = 0; setAlz(false); setDark(true); go('about'); toast('أُعيدت البيانات التجريبية'); };

/* الشاشة الافتتاحية: التطبيق والخدمات، ومنها ينتقل الزائر إلى أي شاشة */
go(state.screen);
</script>
</body>
</html>
