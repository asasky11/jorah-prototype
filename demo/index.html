<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرعة — نموذج تفاعلي</title>
<meta name="description" content="نموذج تفاعلي لتطبيق جرعة | Jor'ah للتذكير بالأدوية والمواعيد الطبية. بيانات وهمية للعرض فقط.">
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- الهوية (DESIGN.md) ---------- */
:root{
  --primary:#0E3A5A; --green:#2D8A6B; --coral:#D9534F; --gold:#D99B26; --appt:#3B6E9E;
  --bg:#F7F9FA; --card:rgba(255,255,255,.80); --card-solid:#FFFFFF; --card-border:rgba(14,58,90,.07);
  --ink:#0E3A5A; --muted:#5B6B78; --sep:#E6EBF0; --field:#EEF2F5; --field-ink:#0E3A5A;
  --nav:rgba(255,255,255,.82); --stage:#E8EDF1; --shadow:0 10px 30px -14px rgba(14,58,90,.25);
  --r-card:20px; --r-btn:14px;
}
[data-theme="dark"]{
  --bg:#121B22; --card:rgba(26,34,40,.86); --card-solid:#1A2228; --card-border:rgba(255,255,255,.06);
  --ink:#F3F6F8; --muted:#94A3B8; --sep:#1E293B; --field:rgba(255,255,255,.07); --field-ink:#F3F6F8;
  --nav:rgba(13,21,27,.86); --stage:#0B1117; --shadow:0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--stage);color:var(--ink);font-size:16px;line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:28px;padding:20px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,b,strong{line-height:1.7;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--field-ink)}
svg{display:block;flex:none}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- خلفية المسرح ---------- */
.stage-art{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.stage-art i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:blob 20s ease-in-out infinite}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}

/* ---------- لوحة العرض ---------- */
.panel{width:252px;font-size:14px;display:flex;flex-direction:column;gap:14px}
.panel h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.panel h1 img{width:36px;height:36px;border-radius:9px}
.panel .tag{font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 6px;font-weight:600;margin-right:6px}
.panel p{color:var(--muted);margin:0;font-size:13.5px}
.pbox{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}
.pbox b{display:block;margin-bottom:8px;font-size:14px}
.pbtn{width:100%;text-align:right;padding:7px 10px;border-radius:9px;border:1px solid var(--card-border);margin-bottom:6px;transition:.15s}
.pbtn:hover{background:var(--field)} .pbtn.active{background:var(--primary);color:#fff;border-color:transparent}
.prow{display:flex;justify-content:space-between;align-items:center;padding:7px 2px}
.back{display:none;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;text-decoration:none}
.back.show{display:flex}

/* ---------- المفتاح ---------- */
.sw{width:46px;height:28px;border-radius:14px;background:#C5CED6;position:relative;flex:none;transition:.2s;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--green)} .sw.on::after{right:21px}

/* ---------- الهاتف ---------- */
.phone{width:390px;height:844px;background:#0A0F14;border-radius:54px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 0 0 2px #2a333b;position:relative;flex:none}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column;transition:background .3s}
.screen-art{position:absolute;top:-60px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 60% 40%,rgba(217,83,79,.22),rgba(139,196,232,.18) 45%,transparent 70%);filter:blur(10px);pointer-events:none}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:14px;font-weight:700;position:relative;z-index:2}
#screens{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
#screens>*{animation:screen-in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes screen-in{from{opacity:0;transform:translateX(-14px)}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 118px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- شريط التطبيق ---------- */
.appbar{position:sticky;top:0;z-index:5;margin:0 -16px 10px;padding:4px 16px 10px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.appbar h2{font-size:19px;font-weight:700;flex:1;text-align:center}
.ib{width:46px;height:46px;border-radius:50%;background:var(--card-solid);border:1px solid var(--card-border);display:grid;place-items:center;box-shadow:0 4px 14px -8px rgba(14,58,90,.3);color:var(--primary)}
.ib.alert{color:var(--coral)} .ib.ghost{background:transparent;border-color:transparent;box-shadow:none}
.spacer{width:46px}

/* ---------- البطاقات والأزرار ---------- */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card);padding:16px;margin-bottom:14px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;line-height:1.75}
.row{display:flex;align-items:center;gap:12px} .sb{justify-content:space-between}
.col{display:flex;flex-direction:column}
.hr{height:1px;background:var(--sep);margin:12px 0}
.btn{height:50px;border-radius:var(--r-btn);padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.45}
.btn-g{background:var(--green);color:#fff} .btn-p{background:var(--primary);color:#fff} .btn-a{background:var(--appt);color:#fff}
.btn-n{background:var(--field);color:var(--ink)} .btn-o{background:transparent;border:1.5px solid var(--sep);color:var(--primary)}
.btn-sm{height:40px;font-size:14.5px;padding:0 14px;border-radius:12px}
.btn-full{width:100%} .btn-pill{border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:999px}
.chip-g{background:rgba(45,138,107,.14);color:var(--green)} .chip-c{background:rgba(217,83,79,.14);color:var(--coral)}
.chip-y{background:rgba(217,155,38,.16);color:var(--gold)} .chip-b{background:rgba(59,110,158,.14);color:var(--appt)} .chip-n{background:var(--field);color:var(--muted)}
.icbox{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.icbox.sm{width:34px;height:34px} .icbox.sm .ic{width:18px;height:18px}
.icbox.g{background:var(--green)} .icbox.p{background:var(--primary)} .icbox.c{background:var(--coral)} .icbox.y{background:var(--gold)} .icbox.b{background:var(--appt)} .icbox.pk{background:#C9336B}
.soft-g{background:rgba(45,138,107,.14);color:var(--green)} .soft-p{background:rgba(14,58,90,.1);color:var(--primary)} .soft-c{background:rgba(217,83,79,.14);color:var(--coral)} .soft-y{background:rgba(217,155,38,.16);color:var(--gold)} .soft-b{background:rgba(59,110,158,.14);color:var(--appt)}
.field{height:52px;border-radius:14px;background:var(--field);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:15px;margin-bottom:12px}
.field input{flex:1;background:transparent;border:0;outline:0;min-width:0}
.field input::placeholder{color:var(--muted);opacity:.8}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px -6px rgba(14,58,90,.5)}
.list .li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--sep);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li b{font-size:16px;display:block} .list .li .sub{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .chev{color:var(--muted);margin-right:auto}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep)}
.set:last-child{border-bottom:0} .set .t{flex:1} .set .t small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.set .ic{color:var(--muted);width:20px;height:20px}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .9s cubic-bezier(.2,.8,.2,1)} .bar i.low{background:var(--coral)}
.stat{flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:var(--field)}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.3} .stat small{color:var(--muted);font-size:12.5px}
.pillicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;border:1px solid rgba(0,0,0,.06);color:var(--primary)}
.pillicon .ic{width:20px;height:20px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--primary);font-weight:800;font-size:20px;flex:none;position:relative}
.avatar.on::after{content:'';position:absolute;bottom:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.feed{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)} .feed:last-child{border-bottom:0}
.feed i{width:10px;height:10px;border-radius:50%;margin-top:10px;flex:none}
.ok{background:var(--green)} .warn{background:var(--gold)} .info{background:var(--appt)}
.ring{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--field) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card-solid)}
.ring span{position:relative;z-index:1;text-align:center;line-height:1.2;font-size:11.5px;color:var(--muted)}
.ring span b{display:block;font-size:17px;color:var(--green);font-weight:800}
.toast{position:absolute;top:66px;left:16px;right:16px;background:var(--primary);color:#fff;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;transform:translateY(-130px);opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:center}
.toast.show{transform:none;opacity:1}

/* الأسبوع */
.week{display:flex;gap:6px;margin:10px 0 14px}
.day{flex:1;height:76px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;position:relative}
.day b{font-size:19px;color:var(--ink);font-weight:700} .day.today{background:var(--primary);color:rgba(255,255,255,.75)} .day.today b{color:#fff}
.day .dots{display:flex;gap:3px;height:5px} .dots i{width:5px;height:5px;border-radius:50%;display:block}

/* بطاقة الجرعة المستحقة: الإطار المتدرج الدوّار هو الاستثناء الوحيد لقاعدة منع التدرج */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.due{padding:2px;border-radius:22px;background:conic-gradient(from var(--a),var(--green),var(--gold),var(--primary),var(--green));animation:spin 5s linear infinite;margin-bottom:14px}
.due>div{background:var(--card-solid);border-radius:20px;padding:16px}
.due .name{font-size:22px;font-weight:800}
.due-act{flex:1;height:48px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,138,107,.5)}70%{box-shadow:0 0 0 12px rgba(45,138,107,0)}100%{box-shadow:0 0 0 0 rgba(45,138,107,0)}}
.pulse{animation:pulse 2.2s ease-out infinite}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--field);margin-bottom:10px}
.item .n{font-weight:700;font-size:15.5px} .item .t{color:var(--muted);font-size:14px;min-width:60px;text-align:center}
.item.done{opacity:.6} .item.done .n{text-decoration:line-through}
.item.appt{background:rgba(59,110,158,.12);border-right:3px solid var(--appt)}
.water-wave{height:10px;border-radius:5px;background:var(--field);overflow:hidden;margin-top:10px}
.water-wave i{display:block;height:100%;background:var(--appt);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.banner{border-radius:var(--r-card);padding:16px;color:#fff;margin-bottom:14px;position:relative;background:linear-gradient(135deg,#E8738B,#D9534F)}
.banner .x{position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.banner .btn{height:42px;font-size:14.5px}

/* التقويم */
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .h{font-size:13px;color:var(--muted);padding:4px 0}
.gc{height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600}
.gc.other{color:#B6C0C9;font-weight:400} .gc.today{background:var(--primary);color:#fff;font-weight:800}

/* التنقل السفلي */
.nav{position:absolute;bottom:18px;left:16px;right:16px;height:66px;border-radius:24px;background:var(--nav);backdrop-filter:blur(18px);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-around;box-shadow:0 12px 34px -10px rgba(14,58,90,.3);z-index:20}
.nb{width:64px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.nb.on{color:var(--green)} .nb.on::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:2px}
.fab{width:62px;height:62px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;margin-top:-34px;box-shadow:0 10px 22px rgba(14,58,90,.4);border:5px solid var(--bg);transition:transform .2s}
.fab:hover{transform:scale(1.06)} .fab .ic{width:28px;height:28px;stroke-width:2.4}

/* النوافذ: كلها في وسط الشاشة فوق خلفية معتمة (قاعدة المالك 12.1) */
.modal{position:absolute;inset:0;background:rgba(14,58,90,.35);backdrop-filter:blur(3px);z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.mbox{width:100%;max-height:92%;overflow:auto;background:var(--card-solid);border-radius:26px;padding:20px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.mbox::-webkit-scrollbar{display:none}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h3{font-size:19px;font-weight:800;flex:1;text-align:center}
.opt{flex:1;padding:22px 10px;border-radius:18px;border:1.5px solid var(--sep);text-align:center;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.15s}
.opt:hover{transform:translateY(-3px);box-shadow:var(--shadow)} .opt.on{border-color:var(--green);background:rgba(45,138,107,.08)}
.steps{display:flex;gap:6px;margin:8px 0 6px} .steps i{flex:1;height:5px;border-radius:3px;background:var(--sep)} .steps i.on{background:var(--green)}
.qbox{background:var(--field);border-radius:18px;padding:16px;margin:10px 0 14px}
.qbox h4{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qbox .field{background:var(--card-solid)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{padding:12px 8px;border-radius:14px;border:1.5px solid var(--sep);text-align:center;font-weight:700;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card-solid)}
.tile.on{border-color:var(--green);background:rgba(45,138,107,.1);color:var(--green)}
.time-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--card-solid);border:1px solid var(--sep);margin-bottom:8px}
.qr{width:150px;height:150px;margin:10px auto;border-radius:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 16px),repeating-linear-gradient(0deg,var(--ink) 0 8px,var(--card-solid) 8px 16px);background-blend-mode:difference;opacity:.85;border:8px solid var(--card-solid);outline:1px solid var(--sep)}
.map{height:220px;border-radius:var(--r-card);position:relative;overflow:hidden;background:#DCE7E2;margin-bottom:14px}
.map::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.05) 38px 40px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.05) 38px 40px)}
.map .zone{position:absolute;left:50%;top:50%;width:170px;height:170px;border-radius:50%;background:rgba(45,138,107,.18);border:2px dashed var(--green);transform:translate(-50%,-50%)}
.map .home{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--primary)}
.map .me{position:absolute;left:58%;top:42%;width:16px;height:16px;border-radius:50%;background:var(--appt);border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,110,158,.3)}
.map .lbl{position:absolute;bottom:10px;right:10px;background:var(--card-solid);border-radius:10px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px} .bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--green);opacity:.85} .bars i.lo{background:var(--gold)}
.tip{background:var(--field);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:10px}
.tip b{font-size:15px} .tip .sub{font-size:13.5px}
.actions{display:flex;justify-content:space-around;background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-card);padding:12px 6px;margin-bottom:14px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--muted);width:70px}
.ecg{height:56px;border-radius:10px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(45,138,107,.15) 24px 25px);margin-top:8px}
.ecg svg{position:absolute;inset:0;width:100%;height:100%}
.hello{font-size:24px;font-weight:800}

/* ---------- الوضع المبسّط (كبار السن / الزهايمر) ---------- */
[data-simple="1"] .screen{--bg:#F9F1EA;--field:#F1E6DC;--card:rgba(255,255,255,.9)}
[data-simple="1"] .hide-simple{display:none !important}
[data-simple="1"] .bigpill{display:grid !important}
[data-simple="1"] .due .name{font-size:30px}
[data-simple="1"] .due-act{height:64px;font-size:19px;border-radius:18px}
[data-simple="1"] .item{padding:18px 14px} [data-simple="1"] .item .n{font-size:19px} [data-simple="1"] .item .t{font-size:16px}

<script>
/* ============ الأيقونات (خطّية وظيفية) ============ */
const P = {

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-8 8"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v2M17 20h4M14 20h1"/>',
  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
  alertT:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',

  paste:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',

  id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.5"/><path d="M14 10h5M14 14h5M4 18a4 4 0 0 1 8 0"/>',

  cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  bellOff:'<path d="M8.5 4.2A6 6 0 0 1 18 8c0 3 .7 5 1.5 6.3M6 8c0 7-3 9-3 9h14M13.7 21a2 2 0 0 1-3.4 0M3 3l18 18"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',

  mapIcon:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  stepsIcon:'<path d="M4 16c0-3 2-5 4-5s3 2 3 4-1 4-3 4-4 0-4-3zM13 8c0-3 2-5 4-5s3 2 3 4-1 4-3 4-4 0-4-3z"/>',
  scale:'<path d="M6 3h12l2 7H4z"/><path d="M12 10v11M7 21h10"/>',
  tag:'<path d="M20 13 11 22 2 13V4h9z"/><circle cx="7" cy="8" r="1.5"/>',

  flask:'<path d="M9 3h6M10 3v6L4 20h16l-6-11V3"/>',

const ic = (n, s = 22, extra = '') => `<svg class="ic" style="width:${s}px;height:${s}px" viewBox="0 0 24 24" ${extra}>${P[n]}</svg>`;

/* ============ الحالة والأدوات ============ */
const D = window.DEMO;
const $ = (s, r = document) => r.querySelector(s);
const fresh = () => ({ screen: 'home', tab: 'home', meds: JSON.parse(JSON.stringify(D.medications)), water: D.water.ml, simple: false, banner: true, suggest: true, wiz: null, period: 'شهر', calFilter: 'all' });
let state = fresh();
if (window.self === window.top) { $('#backLink').classList.add('show'); $('#backLinkM').style.display = 'inline-block'; }

const t12 = t => { const [h, m] = t.split(':').map(Number); const p = h < 12 ? 'ص' : 'م'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${p}`; };
const addMin = (t, n) => { let [h, m] = t.split(':').map(Number); m += n; h = (h + Math.floor(m / 60)) % 24; m %= 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };
function toast(msg, icon = 'check') { $('#toastIcon').innerHTML = ic(icon, 20); $('#toastText').textContent = msg; const el = $('#toast'); el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800); }
function modal(html) { $('#modalIn').innerHTML = html; $('#modal').classList.add('show'); bindModal(); }
function closeModal() { $('#modal').classList.remove('show'); state.wiz = null; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

const takenCount = () => state.meds.filter(m => m.status === 'taken').length;
const nextDue = () => state.meds.find(m => m.status === 'due') || state.meds.find(m => m.status === 'upcoming');
const pillIcon = m => `<div class="pillicon" style="background:${m.color}">${ic('pill', 20)}</div>`;
const sw = on => `<div class="sw ${on ? 'on' : ''}" data-sw></div>`;

/* ============ أجزاء مشتركة ============ */
const appbar = (title, { back = null, right = '', left = '' } = {}) => `<div class="appbar">
  ${back ? `<button class="ib" data-go="${back}" aria-label="رجوع">${ic('chevR')}</button>` : (right || '<span class="spacer"></span>')}
  <h2>${title}</h2>${left || '<span class="spacer"></span>'}</div>`;
const nav = () => `<div class="nav">
  <button class="nb ${state.tab === 'home' ? 'on' : ''}" data-go="home">${ic('home')}الرئيسية</button>
  <button class="nb ${state.tab === 'calendar' ? 'on' : ''}" data-go="calendar">${ic('calendar')}التقويم</button>
  <button class="fab" id="fab" aria-label="إضافة">${ic('plus')}</button>
  <button class="nb ${state.tab === 'meds' ? 'on' : ''}" data-go="meds">${ic('pill')}الأدوية</button>
  <button class="nb ${state.tab === 'profile' ? 'on' : ''}" data-go="profile">${ic('user')}ملفي</button></div>`;
const view = inner => `<div class="view">${inner}</div>`;
const head = (icon, cls, title, sub) => `<div class="row"><div class="icbox ${cls}">${ic(icon)}</div><div class="col" style="flex:1"><h3 style="margin:0">${title}</h3><div class="sub">${sub}</div></div></div>`;

/* ============ الشاشات ============ */
const S = {};

S.home = () => {
  const due = nextDue(), taken = takenCount(), total = state.meds.length;
  const morning = state.meds.filter(m => +m.time.slice(0, 2) < 12), evening = state.meds.filter(m => +m.time.slice(0, 2) >= 12);
  const item = m => `<div class="item ${m.status === 'taken' ? 'done' : ''}">${pillIcon(m)}<div style="flex:1"><div class="n">${m.name} · ${m.dose}</div><div class="sub">${m.note}${m.snoozed ? ' · مؤجّلة' : ''}</div></div><div class="t">${t12(m.time)}</div>${m.status === 'taken' ? `<span style="color:var(--green)">${ic('check', 20)}</span>` : m.status === 'due' ? '<span class="chip chip-y">الآن</span>' : ''}</div>`;
  return view(`
    ${appbar('المتابعة اليومية', { right: `<button class="ib alert" data-go="alerts">${ic('bell')}</button>`, left: `<button class="ib" data-go="profile">${ic('user')}</button>` })}
    <div class="row sb" style="margin-bottom:6px">
      <div><div class="hello">مرحباً، ${D.patient.fullName} 👋</div><div class="sub">${D.today.g} · ${D.today.h}</div></div>
      <div class="ring" style="--p:${Math.round(taken / total * 100)}"><span><b>${taken}/${total}</b>جرعات</span></div>
    </div>
    <div class="week hide-simple">${D.week.map(w => `<div class="day ${w.today ? 'today' : ''}"><span>${w.d}</span><b>${w.n}</b><div class="dots"><i style="background:${w.today ? '#fff' : 'var(--green)'}"></i>${w.n === 29 ? '<i style="background:#fff"></i>' : ''}</div></div>`).join('')}</div>

    ${due ? `<div class="due"><div>
      <div class="bigpill" style="display:none;width:100px;height:100px;border-radius:26px;place-items:center;margin:0 auto 12px;background:${due.color};color:var(--primary)">${ic('pill', 52)}</div>
      <div class="row sb"><div><div class="sub">الجرعة التالية</div><div class="name">${due.name} · ${due.dose}</div><div class="sub">${due.note}</div></div>${pillIcon(due)}</div>
      <div class="row" style="color:var(--gold);font-weight:700;font-size:14.5px;margin-top:6px;gap:6px">${ic('clock', 18)}${due.status === 'due' ? 'حان وقتها الآن' : `الساعة ${t12(due.time)}`}</div>
      <div class="row" style="margin-top:14px"><button class="btn btn-g due-act ${due.status === 'due' ? 'pulse' : ''}" data-take="${due.id}">${ic('check', 20)} تم التناول</button><button class="btn btn-n due-act hide-simple" data-snooze="${due.id}">تأجيل 15 دقيقة</button></div>
    </div></div>` : `<div class="card" style="text-align:center"><div class="icbox g" style="margin:0 auto 8px">${ic('check')}</div><h3>أكملت جرعات اليوم</h3><div class="sub">التزام ممتاز، استمر</div></div>`}

    ${state.suggest && !state.simple ? `<div class="card hide-simple">${head('brain', 'p', 'الوضع المبسّط يناسب حالتك', 'لكبار السن وأصحاب الأمراض المزمنة والمستعصية والزهايمر: شاشة بعناصر كبيرة، تذكير بصوت القريب، وكيل رعاية يسمعك ويجيبك، وعائلة تتابعك بهدوء.')}
      <div class="row" style="margin-top:12px"><button class="btn btn-sm" style="flex:1;background:#7C6BB5;color:#fff" id="enableSimple">${ic('check', 18)} تفعيل الوضع المبسّط</button><button class="btn btn-sm btn-n" id="dismissSuggest">ليس الآن</button></div></div>` : ''}

    ${state.banner ? `<div class="banner hide-simple"><button class="x" id="closeBanner">${ic('x', 16)}</button>

function go(name) {
  const [base] = name.split(':');
  state.screen = name; state.tab = TAB_OF[base] || 'profile';
  render();
  document.querySelectorAll('.panel [data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === name || b.dataset.go === base));
}
function render() {
  const [base, arg] = state.screen.split(':');
  $('#screens').innerHTML = S[base](arg);
  const v = $('#screens .view'); if (v) v.scrollTop = 0;
  bind();
  document.querySelectorAll('#screens .bar i, #screens .water-wave i').forEach(i => { const w = i.style.width; i.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = w; })); });
}
function on(sel, fn, root = document) { root.querySelectorAll(sel).forEach(el => el.onclick = e => { e.stopPropagation(); fn(el, e); }); }
function bind() {
  on('#screens [data-go]', el => go(el.dataset.go));
  on('#screens [data-toast]', el => toast(el.dataset.toast, 'info'));
  on('#screens [data-sw]', el => el.classList.toggle('on'));
  on('[data-take]', el => { const m = state.meds.find(x => x.id === el.dataset.take); m.status = 'taken'; m.stock--; toast(`أحسنت، سُجّلت جرعة ${m.name} وخُصم قرص من المخزون`); render(); });
  on('[data-snooze]', el => { const m = state.meds.find(x => x.id === el.dataset.snooze); m.time = addMin(m.time, 15); m.snoozed = true; m.status = 'upcoming'; state.meds.sort((a, b) => a.time.localeCompare(b.time)); toast(`تم التأجيل إلى ${t12(m.time)} · ستصل سارة إشعاراً إن تأخرت أكثر`, 'clock'); render(); });
  on('#addWater', () => { state.water = Math.min(D.water.goal, state.water + D.water.step); toast(`سُجّل ${D.water.step} مل · ${state.water} من ${D.water.goal} مل`, 'drop'); render(); });
  on('#closeBanner', () => { state.banner = false; render(); });
  on('#dismissSuggest', () => { state.suggest = false; render(); });
  on('#enableSimple, #suggestSimple', () => setSimple(true));
  on('#fab', openAddChoice);
  on('#invite', openInvite);
  on('#importRx', openImport);
  on('#refill', () => { const m = state.meds.find(x => state.screen.endsWith(x.id)); m.stock = m.total; toast('تم تحديث المخزون إلى العبوة الكاملة', 'box'); render(); });
  on('[data-cal]', el => { state.calFilter = el.dataset.cal; render(); });
  on('[data-period]', el => { state.period = el.dataset.period; render(); });
  on('#setDark', () => setDark(document.body.dataset.theme !== 'dark'));
  on('#setSimple', () => setSimple(!state.simple));
}
function bindModal() {
  const r = $('#modalIn');
  on('#mClose, #mClose2', closeModal, r);
  on('[data-toast]', el => { toast(el.dataset.toast, 'info'); if (el.hasAttribute('data-close')) closeModal(); }, r);
  on('#optMed', () => openWizard(1), r);
  on('#optAppt', openAddAppt, r);
  on('#optSimple', () => { closeModal(); setSimple(true); }, r);
  const w = state.wiz;
  if (w) {
    const save = () => { const n = $('#wName', r); if (n) w.name = n.value.trim(); const c = $('#wConc', r); if (c) w.conc = c.value.trim(); const t = $('#wTime', r); if (t && t.value) w.time = t.value; };
    on('#wNext', () => { save(); if (w.step === 1 && !w.name) { toast('اكتب اسم الدواء أولاً', 'info'); return; } openWizard(w.step + 1); }, r);
    on('#wBack', () => { save(); openWizard(w.step - 1); }, r);
    on('[data-form]', el => { w.form = el.dataset.form; openWizard(2); }, r);
    on('[data-freq]', el => { w.freq = el.dataset.freq; openWizard(3); }, r);
    on('[data-meal]', el => { w.meal = el.dataset.meal; openWizard(3); }, r);
    on('[data-start]', el => { w.start = el.dataset.start; openWizard(4); }, r);
    on('#wSave', () => {
      save(); const times = wizTimes(w);
      times.forEach((t, i) => state.meds.push({ id: 'm' + Date.now() + i, name: w.name, dose: w.conc || 'جرعة واحدة', form: w.form, color: '#E3EEF7', time: t, note: w.meal, status: 'upcoming', stock: 30, total: 30, adherence: 100, active: '—', cls: 'جديد' }));
      state.meds.sort((a, b) => a.time.localeCompare(b.time));
      const name = w.name; closeModal(); toast(`أُضيف ${name} وجُدولت ${times.length === 1 ? 'جرعته' : 'جرعاته'}`); go('meds');
    }, r);
  }
}

/* ============ الأوضاع ============ */
function setDark(onn) { document.body.dataset.theme = onn ? 'dark' : 'light'; $('#swDark').classList.toggle('on', onn); if (state.screen === 'settings') render(); }
function setSimple(onn) { state.simple = onn; $('#phone').dataset.simple = onn ? '1' : '0'; $('#swSimple').classList.toggle('on', onn); if (onn) { setDark(false); toast('تم تفعيل الوضع المبسّط: أزرار أكبر وشاشة أبسط', 'brain'); } if (['settings', 'insights'].includes(state.screen)) go('home'); else render(); }
$('#swDark').onclick = () => setDark(!$('#swDark').classList.contains('on'));
$('#swSimple').onclick = () => setSimple(!state.simple);
$('#mDark').onclick = () => setDark(document.body.dataset.theme !== 'dark');
$('#mSimple').onclick = () => setSimple(!state.simple);
document.querySelectorAll('.panel [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#pWizard').onclick = () => { if (state.tab !== 'home') go('home'); state.wiz = null; openWizard(1); };
$('#btnNotify').onclick = () => { toast('حان وقت أتورفاستاتين 20 ملغ · مع الغداء', 'bell'); if (state.screen !== 'home') go('home'); };
$('#btnReset').onclick = () => { state = fresh(); setSimple(false); setDark(true); go('home'); toast('أُعيدت البيانات التجريبية', 'refresh'); };

/* رابط مباشر إلى شاشة: demo/#meds أو demo/#appt:a1 */
const h = decodeURIComponent(location.hash.slice(1)); go(h && S[h.split(':')[0]] ? h : 'home');
</script>
